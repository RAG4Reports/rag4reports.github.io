# Keynote speaker for RAG4Reports 2026.
speaker: Chris Callison-Burch
institution: University of Pennsylvania
photo: ccb.jpg
title: "To be announced"
abstract: ""
bio: >-
  Chris Callison-Burch is a Professor of Computer and Information Science at the
  University of Pennsylvania. His course on Artificial Intelligence has one of the
  highest enrollments at the university with over 500 students taking the class each
  Fall. He is best known for his research into natural language processing. His
  current research is focused on applications of large language models to
  long-standing challenges in artificial intelligence. Prof. Callison-Burch has more
  than 200 publications, which have been cited over 35,000 times. He is a Sloan
  Research Fellow, and he has received faculty research awards from Google, Microsoft,
  Amazon, Facebook, and Roblox, in addition to funding from DARPA, IARPA, and the NSF.
  In 2023, Prof. Callison-Burch testified before congress about the relationship of
  generative AI and Copyright Law.
